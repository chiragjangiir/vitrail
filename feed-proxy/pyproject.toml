[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signflow-feed-proxy"
version = "0.1.0"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "feedparser>=6.0",          # RSS/Atom
    "hvac>=2.1",                # HashiCorp Vault (OAuth tokens sociaux)
    "cachetools>=5.3",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
