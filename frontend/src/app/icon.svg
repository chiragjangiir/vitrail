<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vitrail">
  <!-- Vitrail : des panneaux colorés séparés par des filets sombres (le « plomb »),
       qui sont aussi les zones d'un écran multi-zones. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#151722"/>
  <rect x="9"  y="9"  width="26" height="46" rx="4" fill="#2563EB"/>
  <rect x="39" y="9"  width="16" height="20" rx="4" fill="#10B981"/>
  <rect x="39" y="33" width="16" height="10" rx="3" fill="#F59E0B"/>
  <rect x="39" y="47" width="16" height="8"  rx="3" fill="#EF4444"/>
  <!-- reflet de lumière sur le grand panneau -->
  <path d="M13 14 L22 14 L13 30 Z" fill="#FFFFFF" fill-opacity="0.22"/>
</svg>
