<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" />
  <title>SignFlow — Setup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; cursor: default !important; }

    body {
      background: #1C1E2A;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .card {
      background: #252837;
      border: 1px solid #2e3347;
      border-radius: 10px;
      padding: 3rem 3.5rem;
      width: 100%;
      max-width: 540px;
    }

    .logo {
      font-size: 1.75rem;
      font-weight: 600;
      color: #4875B4;
      letter-spacing: 0.12em;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #66778a;
      margin-bottom: 2.5rem;
    }

    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 0.375rem;
    }

    input[type="text"],
    input[type="url"] {
      width: 100%;
      background: #1C1E2A;
      border: 1px solid #2e3347;
      border-radius: 6px;
      padding: 0.625rem 0.875rem;
      font-size: 0.9375rem;
      color: #e2e8f0;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 1.25rem;
      font-family: inherit;
    }

    input:focus {
      border-color: #4875B4;
    }

    input::placeholder {
      color: #3d4a5c;
    }

    .hint {
      font-size: 0.75rem;
      color: #4a5568;
      margin-top: -0.875rem;
      margin-bottom: 1.25rem;
    }

    .btn {
      width: 100%;
      background: #4875B4;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.75rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
      margin-top: 0.5rem;
    }

    .btn:hover   { background: #3a5fa0; }
    .btn:active  { background: #2e4d87; }
    .btn:disabled {
      background: #2e3347;
      color: #4a5568;
      cursor: not-allowed;
    }

    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 6px;
      padding: 0.625rem 0.875rem;
      font-size: 0.8125rem;
      color: #f87171;
      margin-bottom: 1rem;
      display: none;
    }

    .error.visible { display: block; }

    .step {
      font-size: 0.75rem;
      color: #3d4a5c;
      margin-top: 2rem;
      line-height: 1.6;
    }

    .step strong { color: #4875B4; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Vitrail</div>
    <p class="subtitle">Player first-time setup</p>

    <div class="error" id="error-msg"></div>

    <label for="backend-url">Backend URL</label>
    <input type="url" id="backend-url" placeholder="http://192.168.1.10:8080" autocomplete="off" />

    <label for="player-token">Player Token</label>
    <input type="text" id="player-token" placeholder="sfp_..." autocomplete="off" />
    <p class="hint">Generate this token in Vitrail under Players &rarr; Provisioning.</p>

    <button class="btn" id="save-btn" onclick="save()">Connect player</button>

    <p class="step">
      <strong>1.</strong> Open the Vitrail<br>
      <strong>2.</strong> Go to Players &rarr; Provisioning<br>
      <strong>3.</strong> Create a token and copy it here
    </p>
  </div>

  <script>
    async function save() {
      const backendUrl  = document.getElementById('backend-url').value.trim();
      const playerToken = document.getElementById('player-token').value.trim();
      const errorEl     = document.getElementById('error-msg');
      const btn         = document.getElementById('save-btn');

      errorEl.classList.remove('visible');

      if (!backendUrl) {
        showError('Backend URL is required.');
        return;
      }
      if (!backendUrl.startsWith('http://') && !backendUrl.startsWith('https://')) {
        showError('Backend URL must start with http:// or https://');
        return;
      }
      if (!playerToken) {
        showError('Player token is required.');
        return;
      }

      btn.disabled = true;
      const isProvisioning = playerToken.startsWith('sfp_');
      btn.textContent = isProvisioning ? 'Registering player...' : 'Connecting...';

      try {
        const result = await window.signflow.saveWizard({
          backend_url:  backendUrl,
          player_token: playerToken,
        });
        if (!result.ok) {
          showError('Registration failed: ' + (result.error || 'unknown error'));
          btn.disabled = false;
          btn.textContent = 'Connect player';
        }
      } catch (e) {
        showError('Failed to reach the backend. Check the URL and try again.');
        btn.disabled = false;
        btn.textContent = 'Connect player';
      }
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.add('visible');
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') save();
    });
  </script>
</body>
</html>
