[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signflow-backend"
version = "0.1.0"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # DB
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    # Config
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j
    "tzdata>=2024.1",
    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<5.0",
    "pyotp>=2.9",
    "qrcode[pil]>=7.4",
    # Workers
    "celery[redis]>=5.4",
    "redis>=5.0",
    "msgpack>=1.2.1",  # GHSA-6v7p-g79w-8964 (transitif celery/kombu — plancher forcé)
    # HTTP
    "httpx>=0.27",
    # Feeds (§XXV.3 — parsing RSS/Atom)
    "feedparser>=6.0",
    # Storage
    "boto3>=1.34",
    "Pillow>=10.3",
    # LDAP
    "ldap3>=2.9",
    # Push notifications
    "firebase-admin>=6.5",
    # Email
    "jinja2>=3.1",
    "aiosmtplib>=3.0",
    # PDF — rapport/certificat Proof of Play (§XXIV). reportlab = pur-Python, aucune dépendance
    # système (contrairement à weasyprint) → s'installe tel quel dans l'image slim.
    "reportlab>=4.0",
    # AI — l'agent assistant (§XXVII) est implémenté à la main (boucle function-calling sur
    # LiteLLM), langchain/langgraph ne sont PAS importés → retirés (réduit la surface d'attaque
    # + supprime la vuln transitive langsmith GHSA-f4xh-w4cj-qxq8). Cf. audit 2026-06-24.
    "litellm>=1.40",
    # orjson : dépendance RUNTIME de litellm.acompletion (SDK, chemin BYOK de l'assistant §XXVII).
    # Transitive de litellm mais tombée de l'image slim (07-19) → l'assistant BYOK levait
    # "litellm.APIConnectionError: No module named 'orjson'" et renvoyait « momentanément
    # indisponible » (prod, 2026-07-22). Épinglée EXPLICITEMENT pour garantir sa présence dans
    # toute image, quelle que soit la résolution transitive de litellm.
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "moto[s3]>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = false
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "pass",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
