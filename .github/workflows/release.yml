# Builds the player packages and attaches them to a GitHub Release.
#
#   git tag v1.1.0 && git push origin v1.1.0      → builds + publishes a Release
#   Actions tab → "Release players" → Run workflow → builds only (artifacts on the run)
#
# What is produced (names follow the convention the server's import screen recognises):
#   signflow-player-linux-<ver>.tar.gz     OTA update for the Linux (Debian) player
#   signflow-player-rpi-<ver>.tar.gz       OTA update for the Raspberry Pi player
#   signflow-player-windows-<ver>.tar.gz   OTA update for the Windows player
#   signflow-player-android-<ver>.apk      Android player (first install AND update)
#   SHA256SUMS.txt
# <ver> is read from each player's own package.json / build.gradle.
#
# ANDROID SIGNING. Android only accepts an update signed with the SAME key as the installed
# app. The APK is signed with the project key when these repository secrets exist:
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them, a DEBUG-signed APK is produced: it installs, but a later release built on
# another runner will not update it in place. The release notes say which one you got.
# ChromeOS, BrightSign and the Chrome extension need no package: the server serves them.
name: Release players

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  electron:
    name: Electron update bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack linux / rpi / windows
        run: |
          mkdir -p dist
          for os in linux rpi windows; do
            ver=$(jq -r .version "player-$os/package.json")
            # The player extracts the archive over its install: package.json + src at the ROOT.
            tar -czf "dist/signflow-player-$os-$ver.tar.gz" -C "player-$os" package.json src
            echo "player-$os $ver"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: electron-bundles
          path: dist/

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ver=$(sed -n 's/.*versionName "\([0-9.]*\)".*/\1/p' app/build.gradle | head -1)
          mkdir -p ../dist
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KS_PASS" "$KS_ALIAS" "$KEY_PASS" > keystore.properties
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../dist/signflow-player-android-$ver.apk"
            echo "release-signed" > ../dist/android-signing.txt
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../dist/signflow-player-android-$ver.apk"
            echo "debug-signed" > ../dist/android-signing.txt
          fi
          rm -f release.jks keystore.properties
          echo "player-android $ver ($(cat ../dist/android-signing.txt))"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/

  release:
    name: Publish the release
    needs: [electron, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist
          signing=$(cat android-signing.txt); rm -f android-signing.txt
          sha256sum signflow-player-* > SHA256SUMS.txt
          {
            echo "Player packages built from this tag."
            echo
            echo "- **Linux / Raspberry Pi / Windows**: \`.tar.gz\` update bundles — import them in"
            echo "  the server under *Settings → Updates*, then deploy them to your players."
            echo "- **Android**: install the \`.apk\` on the device (first install), or import it"
            echo "  as an update. This APK is **${signing}**."
            if [ "$signing" = "debug-signed" ]; then
              echo "  A debug-signed APK cannot update an app signed with another key."
            fi
            echo
            echo "First installation and full instructions: see docs/GUIDE.md."
          } > ../NOTES.md
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/
      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.0.8
        with:
          body_path: NOTES.md
          files: dist/*
