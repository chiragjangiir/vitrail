[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Alembic 1.16 : sans ce reglage, chaque execution emet un DeprecationWarning sur
# `prepend_sys_path`. Du bruit a chaque test depuis que la base de test est batie par
# les migrations (P1.5) — et le bruit finit par cacher les avertissements qui comptent.
path_separator = os

# DATABASE_URL sera injecté dynamiquement depuis app/core/config.py via env.py
sqlalchemy.url = postgresql://signflow:signflow@localhost:5432/signflow

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
