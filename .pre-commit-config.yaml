repos:
  # ── Python — Ruff (lint + format, remplace black) ─────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ── Général ───────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/(tsconfig.*|node_modules)/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  # ── JS/TS — Prettier ──────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.2
    hooks:
      - id: prettier
        files: ^frontend/.*\.(ts|tsx|js|jsx|css|md)$
        exclude: ^frontend/(node_modules|\.next)/

  # ── Hooks locaux (nécessitent l'env activé) ───────────────────────────────
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && mypy app --ignore-missing-imports --no-error-summary'
        language: system
        types: [python]
        files: ^backend/app/
        pass_filenames: false

      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/src/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
