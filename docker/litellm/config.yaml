model_list:
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-opus-4-7
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_API_KEY

  # Embeddings RAG (§XXVII) — 100% local via Ollama (nomic-embed-text, 768 dims).
  # Aucune clé API, autonome (recette éprouvée en production). Sert l'AI Assistant.
  - model_name: local/nomic-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434
      timeout: 60

litellm_settings:
  drop_params: true
  request_timeout: 120
